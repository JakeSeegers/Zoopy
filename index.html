<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Zoopy</title>
	<link rel="icon" type="image/png" href="about/favicon.png">
	<!-- Go straight to the app instead of showing a landing page. -->
	<meta http-equiv="refresh" content="0; url=./2/">
	<link rel="canonical" href="./2/">
	<script>
		// Preserve any query string / hash (shared models use ?data=… or #…)
		// so deep links keep working through the redirect.
		location.replace("./2/" + location.search + location.hash);
	</script>
</head>
<body>
	<p>Redirecting to <a href="./2/">the app</a>…</p>
</body>
</html>
